version: '3.8'

services:
  # Centrifugo Real-time Messaging Server
  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: worklab-centrifugo
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c config.json
    ports:
      - "8000:8000"  # HTTP API and WebSocket
    environment:
      - CENTRIFUGO_LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worklab-network

  # OpenSearch for Search Functionality
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: worklab-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=WorkLab_Admin_2024!
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - worklab-network

  # OpenSearch Dashboards
  dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: worklab-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_started
    ports:
      - "5601:5601"
    networks:
      - worklab-network

networks:
  worklab-network:
    driver: bridge
